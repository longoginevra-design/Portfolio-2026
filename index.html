<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ginevra Longo — Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #fafaf8;
    --gray-100: #f2f2f0;
    --gray-300: #d4d4d0;
    --gray-500: #8a8a86;
    --gray-700: #4a4a48;
    --accent: #3B3FFF;
    --accent-light: #EEEFFF;
    --serif: 'DM Serif Display', Georgia, serif;
    --sans: 'DM Sans', -apple-system, sans-serif;
    --max-width: 820px;
    --side-padding: clamp(24px, 5vw, 64px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; font-size: 16px; }

  body {
    font-family: var(--sans);
    background: var(--white);
    color: var(--black);
    line-height: 1.65;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  ::selection { background: var(--black); color: var(--white); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---- NAV ---- */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 20px var(--side-padding);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(250, 250, 248, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s ease;
  }

  nav.scrolled { border-bottom-color: var(--gray-300); }

  nav .name {
    font-family: var(--serif);
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    text-decoration: none;
  }

  nav .nav-links { display: flex; gap: 32px; list-style: none; }

  nav .nav-links a {
    text-decoration: none;
    color: var(--gray-500);
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    transition: color 0.2s;
  }

  nav .nav-links a:hover,
  nav .nav-links a.is-current { color: var(--black); }

  /* ---- LAYOUT ---- */
  .container { max-width: var(--max-width); margin: 0 auto; }

  .view { display: none; }
  .view.is-on { display: block; }

  .section-block { padding: 100px var(--side-padding); scroll-margin-top: 72px; }

  .section-divider {
    height: 1px;
    background: var(--gray-300);
    margin-bottom: 64px;
  }

  .section-number {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 48px;
  }

  .label-inline {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 22px;
  }

  /* ---- HERO ---- */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--gray-300);
  }

  .hero-inner {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 120px var(--side-padding) 56px;
  }

  .hero-label {
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gray-500);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.2s forwards;
  }

  .hero h1 {
    font-family: var(--serif);
    font-size: clamp(2.7rem, 6.4vw, 5rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
    font-weight: 400;
    margin-bottom: 36px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.4s forwards;
  }

  .hero h1 em { font-style: italic; color: var(--accent); }

  .hero-intro {
    font-size: 1.1rem;
    line-height: 1.75;
    color: var(--gray-700);
    max-width: 580px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.6s forwards;
  }

  .hero-aside {
    font-size: 0.88rem;
    color: var(--gray-500);
    font-style: italic;
    line-height: 1.6;
    max-width: 460px;
    margin-top: 22px;
    padding-left: 14px;
    border-left: 2px solid var(--accent);
    opacity: 0;
    animation: fadeUp 0.8s ease 0.72s forwards;
  }

  .hero-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 30px;
    opacity: 0;
    animation: fadeUp 0.8s ease 0.85s forwards;
  }

  .hero-tag {
    font-size: 0.74rem;
    letter-spacing: 0.04em;
    padding: 5px 13px;
    border: 1px solid var(--gray-300);
    border-radius: 100px;
    color: var(--gray-700);
  }

  .hero-tag--accent { border-color: var(--accent); color: var(--accent); }

  .hero-meta-row { padding: 0 var(--side-padding); }

  .hero-meta {
    border-top: 1px solid var(--gray-300);
    padding: 40px 0;
    display: flex;
    gap: 56px;
    opacity: 0;
    animation: fadeUp 0.8s ease 1s forwards;
  }

  .meta-item {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-500);
  }

  .meta-item span {
    display: block;
    font-size: 0.88rem;
    color: var(--black);
    text-transform: none;
    letter-spacing: 0;
    font-weight: 400;
    margin-top: 6px;
  }

  /* ---- PHASES (how I work) ---- */
  .phases {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    list-style: none;
  }

  .phase {
    padding: 26px 20px 28px;
    background: var(--gray-100);
    border-radius: 4px;
    position: relative;
  }

  .phase-number {
    font-family: var(--serif);
    font-size: 2rem;
    color: var(--accent);
    opacity: 0.28;
    line-height: 1;
    margin-bottom: 14px;
  }

  .phase h4 { font-weight: 500; font-size: 0.9rem; margin-bottom: 8px; }
  .phase p { font-size: 0.82rem; color: var(--gray-700); line-height: 1.6; }

  .phases-note {
    margin-top: 26px;
    font-size: 0.86rem;
    color: var(--gray-500);
    font-style: italic;
    max-width: 560px;
  }

  /* ---- WORK INDEX ---- */
  .work-item {
    padding: 48px 0;
    border-top: 1px solid var(--gray-300);
    display: block;
    text-decoration: none;
  }

  .work-item:last-of-type { border-bottom: 1px solid var(--gray-300); }

  .work-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .work-title {
    font-family: var(--serif);
    font-size: clamp(1.6rem, 3.2vw, 2.1rem);
    letter-spacing: -0.025em;
    line-height: 1.12;
    transition: color 0.2s;
  }

  .work-item:hover .work-title { color: var(--accent); }

  .work-date { font-size: 0.85rem; color: var(--gray-500); white-space: nowrap; }

  .work-role-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .work-role { font-size: 0.88rem; color: var(--gray-700); }

  .work-tag {
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gray-500);
    background: var(--gray-100);
    padding: 3px 10px;
    border-radius: 3px;
  }

  .work-desc {
    font-size: 0.94rem;
    color: var(--gray-700);
    line-height: 1.72;
    max-width: 600px;
  }

  .work-go {
    display: inline-block;
    margin-top: 20px;
    font-size: 0.82rem;
    color: var(--accent);
    letter-spacing: 0.02em;
    border-bottom: 1px solid transparent;
  }

  .work-item:hover .work-go { border-bottom-color: var(--accent); }

  /* ---- IMPACT CALLOUT ---- */
  .impact {
    margin-top: 28px;
    padding: 20px 24px;
    background: var(--accent-light);
    border-radius: 4px;
    border-left: 3px solid var(--accent);
    font-size: 0.88rem;
    line-height: 1.65;
    color: var(--gray-700);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .impact-label {
    font-size: 0.64rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.85;
  }

  .impact-row { display: flex; align-items: baseline; gap: 16px; }

  .impact .number {
    font-family: var(--serif);
    font-size: 2rem;
    letter-spacing: -0.03em;
    color: var(--accent);
    white-space: nowrap;
    line-height: 1;
  }

  /* ---- WHY / CLOSING PROSE ---- */
  .prose-lead {
    font-family: var(--serif);
    font-size: clamp(1.5rem, 3.4vw, 2.3rem);
    line-height: 1.3;
    letter-spacing: -0.02em;
    max-width: 640px;
    margin-bottom: 34px;
  }

  .prose-body {
    font-size: 1rem;
    line-height: 1.8;
    color: var(--gray-700);
    max-width: 620px;
  }

  .prose-body p { margin-bottom: 18px; }
  .prose-body p:last-child { margin-bottom: 0; }
  .prose-body strong { color: var(--black); font-weight: 500; }
  .prose-body em { font-style: italic; }

  /* ---- CONTACT ---- */
  .contact-lead {
    font-size: 0.9rem;
    color: var(--gray-500);
    margin-bottom: 20px;
    line-height: 1.6;
    max-width: 460px;
  }

  .contact-big {
    display: inline-block;
    font-family: var(--serif);
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    color: var(--black);
    text-decoration: none;
    border-bottom: 2px solid var(--gray-300);
    transition: border-color 0.2s, color 0.2s;
    margin-bottom: 16px;
  }

  .contact-big:hover { border-bottom-color: var(--accent); color: var(--accent); }

  .contact-phone {
    display: block;
    font-size: 0.9rem;
    color: var(--gray-500);
    text-decoration: none;
    margin-top: 10px;
    transition: color 0.2s;
  }

  .contact-phone:hover { color: var(--black); }

  /* ---- CASE PAGES ---- */
  .case-top { padding: 120px var(--side-padding) 0; }

  .backlink {
    display: inline-block;
    font-size: 0.82rem;
    color: var(--gray-500);
    text-decoration: none;
    margin-bottom: 34px;
    transition: color 0.2s;
  }

  .backlink:hover { color: var(--accent); }

  .case-title {
    font-family: var(--serif);
    font-size: clamp(2.2rem, 5.4vw, 3.6rem);
    line-height: 1.08;
    letter-spacing: -0.03em;
    font-weight: 400;
    margin-bottom: 28px;
  }

  .case-title em { font-style: italic; color: var(--accent); }

  .case-lede {
    font-size: 1.1rem;
    line-height: 1.75;
    color: var(--gray-700);
    max-width: 600px;
  }

  .case-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }

  /* summary card */
  .spec {
    margin-top: 44px;
    background: var(--gray-100);
    border-radius: 4px;
    padding: 8px 26px;
  }

  .spec-row {
    display: grid;
    grid-template-columns: 132px 1fr;
    gap: 22px;
    padding: 16px 0;
    border-bottom: 1px solid var(--gray-300);
  }

  .spec-row:last-child { border-bottom: none; }

  .spec-row dt {
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray-500);
    padding-top: 4px;
  }

  .spec-row dd { margin: 0; font-size: 0.9rem; color: var(--gray-700); line-height: 1.6; }
  .spec-row dd b { color: var(--black); font-weight: 500; }
  .spec-row--key dd {
    font-family: var(--serif);
    font-size: 1.15rem;
    color: var(--black);
    letter-spacing: -0.015em;
    line-height: 1.3;
  }
  .spec-row--key dd small {
    display: block;
    font-family: var(--sans);
    font-size: 0.84rem;
    color: var(--gray-500);
    letter-spacing: 0;
    margin-top: 4px;
    line-height: 1.55;
  }

  /* case body */
  .case-section { margin-bottom: 64px; }
  .case-section:last-of-type { margin-bottom: 0; }

  .case-section h2 {
    font-family: var(--serif);
    font-size: clamp(1.4rem, 2.8vw, 1.9rem);
    letter-spacing: -0.02em;
    line-height: 1.2;
    font-weight: 400;
    margin-bottom: 20px;
  }

  .case-body { font-size: 0.98rem; line-height: 1.8; color: var(--gray-700); max-width: 640px; }
  .case-body p { margin-bottom: 16px; }
  .case-body p:last-child { margin-bottom: 0; }
  .case-body strong { color: var(--black); font-weight: 500; }
  .case-body em { font-style: italic; }

  .decisions { list-style: none; }

  .decision {
    padding: 26px 0;
    border-top: 1px solid var(--gray-300);
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 16px;
  }

  .decision:last-child { border-bottom: 1px solid var(--gray-300); }

  .decision-mark {
    font-size: 0.82rem;
    color: var(--accent);
    opacity: 0.7;
    padding-top: 0.35em;
  }

  .decision h3 {
    font-family: var(--serif);
    font-size: 1.2rem;
    font-weight: 400;
    letter-spacing: -0.015em;
    margin-bottom: 8px;
    line-height: 1.3;
  }

  .decision p { font-size: 0.92rem; color: var(--gray-700); line-height: 1.72; margin-bottom: 12px; max-width: 600px; }
  .decision p:last-child { margin-bottom: 0; }

  .reflect {
    background: var(--gray-100);
    border-radius: 4px;
    padding: 26px 28px;
  }

  .reflect h2 { margin-bottom: 14px; }
  .reflect .case-body { max-width: none; }

  .footnote {
    margin-top: 56px;
    padding-top: 18px;
    border-top: 1px solid var(--gray-300);
    font-size: 0.84rem;
    color: var(--gray-500);
    font-style: italic;
    line-height: 1.6;
  }

  .tbc {
    background: var(--accent-light);
    color: var(--accent);
    font-style: normal;
    font-size: 0.82em;
    letter-spacing: 0.04em;
    padding: 1px 6px;
    border-radius: 3px;
  }

  .pager {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--gray-300);
  }

  .pager a { text-decoration: none; max-width: 46%; }
  .pager a span {
    display: block;
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray-500);
    margin-bottom: 6px;
  }
  .pager a em {
    font-family: var(--serif);
    font-style: normal;
    font-size: 1.15rem;
    letter-spacing: -0.02em;
    transition: color 0.2s;
  }
  .pager a:hover em { color: var(--accent); }
  .pager .right { text-align: right; margin-left: auto; }

  /* ---- FOOTER ---- */
  footer { padding: 44px var(--side-padding); border-top: 1px solid var(--gray-300); }

  footer .container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 20px;
  }

  footer .made-with { font-size: 0.78rem; color: var(--gray-500); }
  footer a { color: var(--gray-500); text-decoration: none; font-size: 0.78rem; }
  footer a:hover { color: var(--black); }

  /* ---- ANIMATIONS ---- */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .reveal { opacity: 0; transform: translateY(16px); transition: opacity 0.65s ease, transform 0.65s ease; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; opacity: 1 !important; transform: none !important; }
    html { scroll-behavior: auto; }
  }

  /* ---- RESPONSIVE ---- */
  @media (max-width: 768px) {
    .hero-meta { flex-direction: column; gap: 24px; }
    .phases { grid-template-columns: 1fr 1fr; gap: 12px; }
    .section-block { padding: 72px var(--side-padding); }
    .hero-inner { padding-top: 108px; }
    .case-top { padding-top: 104px; }
    .spec-row { grid-template-columns: 1fr; gap: 6px; }
    .spec-row dt { padding-top: 0; }
    nav .nav-links { gap: 18px; }
    nav .nav-links a { font-size: 0.78rem; }
    .impact-row { flex-direction: column; gap: 8px; }
  }

  @media (max-width: 480px) {
    .phases { grid-template-columns: 1fr; }
    nav .nav-links { gap: 14px; }
    nav .nav-links a { font-size: 0.74rem; }
    .decision { grid-template-columns: 1fr; gap: 6px; }
    .decision-mark { display: none; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <a class="name" href="#/">Ginevra Longo</a>
  <ul class="nav-links">
    <li><a href="#approach" data-nav="approach">Approach</a></li>
    <li><a href="#work" data-nav="work">Work</a></li>
    <li><a href="#next" data-nav="next">Next step</a></li>
    <li><a href="#contact" data-nav="contact">Contact</a></li>
  </ul>
</nav>

<!-- rest of content copied from portfolio.html -->

</body>
</html>
